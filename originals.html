<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Annyeongz 原文書櫃</title>
  <style>
    :root {
      --bg: #eef6fb;
      --ink: #183247;
      --muted: #62798c;
      --card: #fbfdff;
      --line: #cfe0ec;
      --rose: #3e79a8;
      --rose-soft: #dcebf5;
      --green: #3f8f7a;
      --green-soft: #dff1ec;
      --blue: #2f6f9f;
      --blue-soft: #d9eaf6;
      --gold: #a9863d;
      --gold-soft: #f2ead8;
      --ink-soft: #e4eef6;
      --shadow: 0 12px 32px rgba(28, 69, 101, .1);
    }

    [data-theme="dark"] {
      --bg: #101b26;
      --ink: #edf6fb;
      --muted: #9bb0c0;
      --card: #172636;
      --line: #294258;
      --rose: #89c2ea;
      --rose-soft: #173449;
      --green: #75c8af;
      --green-soft: #17362f;
      --blue: #9bd0f2;
      --blue-soft: #183246;
      --gold: #dec77b;
      --gold-soft: #352f1d;
      --ink-soft: #22364a;
      --shadow: 0 12px 32px rgba(0, 0, 0, .28);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
      line-height: 1.55;
      overflow-x: auto;
    }

    button, input, select { font: inherit; }

    .hero {
      min-height: 230px;
      padding: 36px 22px 30px;
      color: #fff;
      background:
        linear-gradient(120deg, rgba(13, 42, 67, .86), rgba(45, 105, 148, .5)),
        url("https://images.unsplash.com/photo-1519682337058-a94d519337bc?auto=format&fit=crop&w=1800&q=80") center/cover;
      display: grid;
      align-content: end;
      gap: 10px;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 58px);
      letter-spacing: 0;
      line-height: 1.05;
      text-shadow: 0 6px 26px rgba(0, 0, 0, .42);
    }

    .hero p {
      margin: 0;
      max-width: 720px;
      font-size: 15px;
      opacity: .94;
      text-shadow: 0 2px 16px rgba(0, 0, 0, .38);
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
    }

    .hero-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      border: 1px solid rgba(255, 255, 255, .72);
      border-radius: 8px;
      background: rgba(255, 255, 255, .15);
      color: #fff;
      padding: 8px 13px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      text-shadow: 0 2px 12px rgba(0, 0, 0, .34);
      backdrop-filter: blur(8px);
    }

    .hero-link:hover {
      background: rgba(255, 255, 255, .24);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: minmax(220px, .75fr) max-content max-content max-content;
      gap: 8px;
      align-items: center;
      padding: 12px 18px;
      background: color-mix(in srgb, var(--card) 92%, transparent);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(12px);
    }

    .search {
      min-width: 0;
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--bg);
      color: var(--ink);
      padding: 10px 13px;
    }

    .ctl {
      min-height: 39px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--card);
      color: var(--ink);
      padding: 8px 12px;
      cursor: pointer;
    }

    .ctl:hover, .chip:hover, .tree button:hover {
      border-color: var(--rose);
      color: var(--rose);
    }

    .shell {
      width: calc(100% - 28px);
      margin: 18px 14px 48px;
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 18px;
      align-items: start;
    }

    .panel {
      position: sticky;
      top: 76px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      box-shadow: var(--shadow);
    }

    .panel h2, .section-title {
      margin: 0 0 12px;
      font-size: 17px;
      letter-spacing: 0;
    }

    .tree {
      display: grid;
      gap: 5px;
    }

    .tree button {
      width: 100%;
      text-align: left;
      border: 1px solid transparent;
      background: transparent;
      color: var(--ink);
      border-radius: 8px;
      padding: 6px 8px;
      min-height: 34px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .tree button.active {
      background: var(--rose-soft);
      color: var(--rose);
      border-color: color-mix(in srgb, var(--rose) 42%, transparent);
    }

    .tree .count {
      color: var(--muted);
      font-size: 9px;
    }

    .filters {
      margin-top: 16px;
      border-top: 1px solid var(--line);
      padding-top: 14px;
    }

    .chipset {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .chip {
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--ink);
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 12px;
      cursor: pointer;
    }

    .chip.active {
      background: var(--blue-soft);
      color: var(--blue);
      border-color: color-mix(in srgb, var(--blue) 46%, transparent);
    }

    .main {
      min-width: 0;
      display: grid;
      gap: 14px;
    }

    .strip {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(210px, 1fr);
      gap: 10px;
      overflow-x: auto;
      max-width: 100%;
      min-width: 0;
      padding-bottom: 4px;
      scrollbar-width: thin;
    }

    .small-card, .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .small-card {
      padding: 11px 12px;
      cursor: pointer;
      min-width: 0;
      text-align: left;
    }

    .small-card b {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      font-size: 14px;
    }

    .small-card span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .toolbar {
      display: flex;
      flex-direction: column;
      gap: 9px;
      align-items: flex-start;
      justify-content: flex-start;
      flex-wrap: wrap;
    }

    .random-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .card {
      position: relative;
      border-left: 4px solid var(--line);
      padding: 11px 12px;
      cursor: pointer;
      min-height: 154px;
    }

    .card:hover {
      border-color: var(--rose);
      box-shadow: 0 14px 34px rgba(47, 111, 159, .16);
    }

    .card.status-ongoing { border-left-color: var(--blue); }
    .card.status-done { border-left-color: var(--green); }

    .title {
      margin: 0 0 5px;
      font-weight: 700;
      font-size: 16px;
      overflow-wrap: anywhere;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .k-title {
      color: var(--muted);
      font-size: 12px;
      min-height: 18px;
      margin-bottom: 7px;
      overflow-wrap: anywhere;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .meta {
      display: grid;
      gap: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .text-action {
      appearance: none;
      border: 0;
      padding: 0;
      background: transparent;
      color: var(--ink);
      font: inherit;
      cursor: pointer;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .text-action:hover { color: var(--rose); }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin: 8px 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 21px;
      border-radius: 999px;
      padding: 2px 7px;
      font-size: 11px;
      background: var(--ink-soft);
      color: var(--muted);
    }

    .badge.done { background: var(--green-soft); color: var(--green); }
    .badge.ongoing { background: var(--blue-soft); color: var(--blue); }
    .badge.new { background: var(--gold-soft); color: var(--gold); }
    .badge.page { background: var(--rose-soft); color: var(--rose); }
    .badge.paid { background: #e8effb; color: #315f96; }

    [data-theme="dark"] .badge.paid {
      background: #203853;
      color: #a8d0f2;
    }

    .links {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 9px;
    }

    .links a, .modal-links a,
    .links .link-disabled, .modal-links .link-disabled {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 8px;
      color: var(--ink);
      text-decoration: none;
      font-size: 11px;
      line-height: 1.35;
      background: var(--bg);
      max-width: 100%;
      overflow-wrap: anywhere;
      white-space: normal;
    }

    .links .link-disabled, .modal-links .link-disabled {
      color: var(--muted);
      cursor: default;
      opacity: .82;
    }

    .links a:hover, .modal-links a:hover {
      color: var(--rose);
      border-color: var(--rose);
    }

    .empty {
      border: 1px dashed var(--line);
      border-radius: 8px;
      min-height: 180px;
      display: grid;
      place-items: center;
      color: var(--muted);
      text-align: center;
      background: color-mix(in srgb, var(--card) 70%, transparent);
    }

    .modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(0, 0, 0, .48);
      z-index: 50;
    }

    .modal.open { display: flex; }

    .sheet {
      width: min(620px, 100%);
      max-height: 86vh;
      overflow: auto;
      background: var(--card);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, .26);
    }

    .sheet-head {
      display: flex;
      gap: 12px;
      justify-content: space-between;
      align-items: start;
      min-width: 0;
    }

    .sheet-head > div { min-width: 0; }

    .close {
      border: 1px solid var(--line);
      border-radius: 50%;
      width: 34px;
      height: 34px;
      background: var(--bg);
      color: var(--ink);
      cursor: pointer;
      flex: 0 0 auto;
    }

    .detail-row {
      display: grid;
      grid-template-columns: 96px 1fr;
      gap: 12px;
      border-top: 1px solid var(--line);
      padding: 11px 0;
      font-size: 14px;
    }

    .detail-row dt { color: var(--muted); }
    .detail-row dd { margin: 0; }

    .to-top {
      position: fixed;
      right: 14px;
      bottom: 16px;
      z-index: 8;
      width: 42px;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--card);
      color: var(--ink);
      box-shadow: var(--shadow);
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      line-height: 1;
    }

    .to-top:hover {
      background: var(--rose-soft);
      color: var(--rose);
      border-color: color-mix(in srgb, var(--rose) 38%, transparent);
    }

    @media (max-width: 820px) {
      .topbar {
        grid-template-columns: minmax(0, 1fr) auto;
      }

      .search {
        grid-column: 1 / -1;
        order: 1;
      }

      .topbar select { order: 2; }
      .topbar #theme { order: 3; }

      .shell {
        grid-template-columns: 1fr;
        margin-left: auto;
        margin-right: auto;
      }

      .panel { position: static; }
      .tree { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 520px) {
      body { font-size: 15px; }

      .hero {
        min-height: 190px;
        padding: 24px 16px 18px;
      }

      .hero h1 { font-size: 34px; }
      .hero p { font-size: 14px; }

      .topbar {
        grid-template-columns: 1fr 1fr;
        padding: 10px 12px;
        gap: 8px;
      }

      .topbar .ctl,
      .topbar select {
        width: 100%;
      }

      .random-actions {
        width: 100%;
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .shell {
        width: calc(100% - 18px);
        margin-top: 12px;
        gap: 12px;
      }

      .panel { padding: 12px; }

      .strip {
        grid-auto-flow: row;
        grid-auto-columns: unset;
        grid-template-columns: 1fr;
        overflow-x: visible;
      }

      .tree { grid-template-columns: 1fr; }
      .to-top { display: flex; }

      .grid {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .card {
        min-height: 0;
        padding: 12px;
      }

      .title { font-size: 15px; }
      .meta { font-size: 12px; }

      .links {
        display: grid;
        grid-template-columns: 1fr;
      }

      .links a,
      .modal-links a {
        border-radius: 8px;
        padding: 8px 10px;
      }

      .modal-links {
        display: grid;
        grid-template-columns: 1fr;
      }

      .detail-row {
        grid-template-columns: 1fr;
        gap: 2px;
      }

      .modal {
        padding: 8px;
      }

      .sheet {
        max-height: 92vh;
        padding: 16px;
        width: 100%;
      }

      .sheet-head {
        gap: 8px;
      }

      .sheet-head h2 {
        font-size: 18px;
        overflow-wrap: anywhere;
      }
    }
  </style>
</head>
<body>
  <header class="hero">
    <h1>Annyeongz 原文書櫃</h1>
    <p>公開原文索引，只收錄書目中的原文連結。</p>
    <div class="hero-actions">
      <a class="hero-link" href="./index.html">備份區</a>
    </div>
  </header>

  <div class="topbar">
    <input id="search" class="search" placeholder="搜尋篇名 / 韓文篇名 / 原作">
    <select id="sort" class="ctl" aria-label="排序">
      <option value="date-desc">日期新到舊</option>
      <option value="title">篇名 A-Z</option>
      <option value="author">原作 A-Z</option>
    </select>
    <select id="updateFilter" class="ctl" aria-label="更新狀態篩選">
      <option value="全部">全部更新狀態</option>
      <option value="@新入荷">新入荷</option>
      <option value="@有更新">有更新</option>
    </select>
    <button id="theme" class="ctl" type="button">深色</button>
  </div>

  <div class="shell">
    <aside class="panel">
      <h2>分頁樹</h2>
      <nav class="tree" id="tree"></nav>

      <div class="filters">
        <h2>狀態</h2>
        <div class="chipset" id="statusFilters"></div>
      </div>
    </aside>

    <main class="main">
      <section>
        <h2 class="section-title">最新收錄</h2>
        <div class="strip" id="latest"></div>
      </section>

      <section>
        <div class="toolbar">
          <div>
            <h2 class="section-title" id="resultTitle">全部作品</h2>
            <div class="hint" id="countText"></div>
          </div>
          <div class="random-actions">
            <button class="ctl" id="randomBtn" type="button">隨機看一篇</button>
            <button class="ctl" id="recentRandomBtn" type="button">近期隨機</button>
          </div>
        </div>
        <div class="grid" id="grid"></div>
      </section>
    </main>
  </div>

  <div class="modal" id="modal" aria-hidden="true">
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="sheet-head">
        <div>
          <h2 id="modalTitle" style="margin:0 0 4px"></h2>
          <div id="modalSub" class="k-title"></div>
        </div>
        <button class="close" id="closeBtn" type="button" aria-label="關閉">×</button>
      </div>
      <div class="badges" id="modalBadges"></div>
      <dl id="modalRows"></dl>
      <div class="modal-links links" id="modalLinks"></div>
    </div>
  </div>

  <button class="to-top" id="toTopBtn" type="button" aria-label="回到頂端">↑</button>

  <script src="data.js?v=20260825-2018"></script>
  <script>
    const ALL_DATA = window.BOOK_DATA || [];
    const POSTYPE_ORIGINAL_PATTERN = /^https?:\/\/(?:www\.)?(?:postype\.com|posty\.pe)\//i;
    const DATA = ALL_DATA.filter(item => POSTYPE_ORIGINAL_PATTERN.test(String(item.original || "").trim()));
    const SHORT_STATUS_DAYS = 7;

    const state = {
      page: "全部",
      status: "全部",
      updateFilter: "全部",
      query: "",
      sort: "date-desc"
    };

    const el = {
      tree: document.querySelector("#tree"),
      statusFilters: document.querySelector("#statusFilters"),
      grid: document.querySelector("#grid"),
      latest: document.querySelector("#latest"),
      countText: document.querySelector("#countText"),
      resultTitle: document.querySelector("#resultTitle"),
      search: document.querySelector("#search"),
      sort: document.querySelector("#sort"),
      updateFilter: document.querySelector("#updateFilter"),
      theme: document.querySelector("#theme"),
      random: document.querySelector("#randomBtn"),
      recentRandom: document.querySelector("#recentRandomBtn"),
      modal: document.querySelector("#modal"),
      close: document.querySelector("#closeBtn"),
      modalTitle: document.querySelector("#modalTitle"),
      modalSub: document.querySelector("#modalSub"),
      modalBadges: document.querySelector("#modalBadges"),
      modalRows: document.querySelector("#modalRows"),
      modalLinks: document.querySelector("#modalLinks"),
      toTop: document.querySelector("#toTopBtn")
    };

    function parseDate(value) {
      const raw = String(value || "").trim();
      const match = raw.match(/^(\d{4})[\/.-](\d{1,2})[\/.-](\d{1,2})/);
      if (!match) return null;
      return new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]));
    }

    function dateKey(item) {
      const date = parseDate(item.date);
      return date ? Number(String(item.date).replace(/\D/g, "").slice(0, 8)) : 0;
    }

    function dateAgeDays(item) {
      const date = parseDate(item.date);
      if (!date) return Infinity;
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      return Math.floor((today - date) / 86400000);
    }

    function normalize(value) {
      return String(value || "").toLowerCase().replace(/\s+/g, "");
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function statusClass(item) {
      return String(item.status || "").includes("連載") ? "ongoing" : "done";
    }

    function statusText(item) {
      return String(item.status || "未分類").replace(/^\d\./, "");
    }

    function isShortStatusActive(item) {
      const age = dateAgeDays(item);
      return age >= 0 && age < SHORT_STATUS_DAYS;
    }

    function shortStatusText(item) {
      if (!isShortStatusActive(item)) return "";
      const status = String(item.status || "");
      if (status.includes("連載") || status.includes("翻譯中")) return "@有更新";
      if (status.includes("已完結")) return "@新入荷";
      return "";
    }

    function visibleNote(item) {
      return String(item.note || "").replace(/@(?:新入荷|有更新)/g, "").trim();
    }

    function visibleItems() {
      const q = normalize(state.query);
      let items = DATA.filter(item => {
        const pageOK = state.page === "全部" || item.page === state.page;
        const statusOK = state.status === "全部" || item.status === state.status;
        const updateOK = state.updateFilter === "全部" || shortStatusText(item) === state.updateFilter;
        const hay = normalize([item.zh, item.ko, item.author, visibleNote(item), shortStatusText(item)].join(" "));
        return pageOK && statusOK && updateOK && (!q || hay.includes(q));
      });

      if (state.sort === "date-desc") items.sort((a, b) => dateKey(b) - dateKey(a));
      if (state.sort === "title") items.sort((a, b) => String(a.zh).localeCompare(String(b.zh), "zh-Hant"));
      if (state.sort === "author") items.sort((a, b) => String(a.author).localeCompare(String(b.author), "zh-Hant"));
      return items;
    }

    function newArrivalItems() {
      return DATA.filter(item => shortStatusText(item) === "@新入荷");
    }

    function recentItems() {
      const now = new Date();
      const cutoff = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 30);
      return visibleItems().filter(item => {
        const date = parseDate(item.date);
        return date && date >= cutoff;
      });
    }

    function openRandom(items, emptyMessage) {
      if (!items.length) {
        window.alert(emptyMessage);
        return;
      }
      openDetail(DATA.indexOf(items[Math.floor(Math.random() * items.length)]));
    }

    function pageCounts() {
      const counts = new Map();
      DATA.forEach(item => counts.set(item.page, (counts.get(item.page) || 0) + 1));
      return [...counts.entries()]
        .map(([name, count]) => ({ name, count }))
        .sort((a, b) => a.name.localeCompare(b.name, "zh-Hant"));
    }

    function renderTree() {
      const pages = [
        { name: "全部", count: DATA.length },
        ...pageCounts()
      ];
      el.tree.innerHTML = pages.map(p => `
        <button type="button" class="${state.page === p.name ? "active" : ""}" data-page="${escapeHtml(p.name)}">
          <span>${p.name === "全部" ? "原文總覽" : escapeHtml(p.name)}</span>
          <span class="count">${p.count}</span>
        </button>
      `).join("");
    }

    function renderStatusFilters() {
      const statuses = ["全部", ...new Set(DATA.map(item => item.status))];
      el.statusFilters.innerHTML = statuses.map(status => `
        <button type="button" class="chip ${state.status === status ? "active" : ""}" data-status="${escapeHtml(status)}">
          ${status === "全部" ? "全部" : escapeHtml(statusText({ status }))}
        </button>
      `).join("");
    }

    function badges(item) {
      const cls = statusClass(item);
      return `
        <span class="badge ${cls}">${escapeHtml(statusText(item))}</span>
        <span class="badge page">#${escapeHtml(item.page)}</span>
        ${item.paid ? `<span class="badge paid">付費</span>` : ""}
        ${shortStatusText(item) ? `<span class="badge new">${shortStatusText(item)}</span>` : ""}
        ${visibleNote(item) ? `<span class="badge new">${escapeHtml(visibleNote(item))}</span>` : ""}
      `;
    }

    function authorSearchButton(item) {
      return `<button class="text-action" type="button" data-author-search="${DATA.indexOf(item)}">${escapeHtml(item.author || "未填")}</button>`;
    }

    function searchAuthor(author) {
      if (!author) return;
      state.page = "全部";
      state.status = "全部";
      state.query = author;
      el.search.value = author;
      closeDetail();
      render();
      document.querySelector(".toolbar")?.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function originalLink(item, label = "原文") {
      if (!item.original) return `<span class="link-disabled">未收錄原文連結</span>`;
      return `<a href="${escapeHtml(item.original)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${label}</a>`;
    }

    function card(item) {
      const id = DATA.indexOf(item);
      return `
        <article class="card status-${statusClass(item)}" data-id="${id}" tabindex="0">
          <h3 class="title">${escapeHtml(item.zh)}</h3>
          <div class="k-title">${escapeHtml(item.ko)}</div>
          <div class="badges">${badges(item)}</div>
          <div class="meta">
            <span>原作：${authorSearchButton(item)}</span>
            <span>日期：${escapeHtml(item.date)}</span>
          </div>
          <div class="links">
            ${originalLink(item)}
          </div>
        </article>
      `;
    }

    function renderLatest() {
      const items = newArrivalItems().sort((a, b) => dateKey(b) - dateKey(a)).slice(0, 5);
      el.latest.innerHTML = items.length
        ? items.map(item => `<button class="small-card" type="button" data-id="${DATA.indexOf(item)}"><b>${escapeHtml(item.zh)}</b><span>#${escapeHtml(item.page)} · ${escapeHtml(item.date)}</span></button>`).join("")
        : `<div class="empty">目前沒有新入荷作品</div>`;
    }

    function renderGrid() {
      const items = visibleItems();
      el.resultTitle.textContent = state.page === "全部" ? "全部作品" : `#${state.page}`;
      el.countText.textContent = `${items.length} / ${DATA.length} 筆，依目前條件顯示`;
      el.grid.innerHTML = items.length ? items.map(card).join("") : `<div class="empty">找不到符合條件的作品</div>`;
    }

    function render() {
      renderTree();
      renderStatusFilters();
      renderLatest();
      renderGrid();
    }

    function row(label, value) {
      return `<div class="detail-row"><dt>${label}</dt><dd>${value || "未填"}</dd></div>`;
    }

    function openDetail(id) {
      const item = DATA[id];
      if (!item) return;
      el.modalTitle.textContent = item.zh;
      el.modalSub.textContent = item.ko;
      el.modalBadges.innerHTML = badges(item);
      el.modalRows.innerHTML = [
        row("分頁", "#" + escapeHtml(item.page)),
        row("狀態", escapeHtml(statusText(item))),
        row("原作", authorSearchButton(item)),
        row("付費", item.paid ? "是" : "否"),
        row("備註", escapeHtml([shortStatusText(item), visibleNote(item)].filter(Boolean).join(" "))),
        row("日期", escapeHtml(item.date))
      ].join("");
      el.modalLinks.innerHTML = originalLink(item, "原文連結");
      el.modal.classList.add("open");
      el.modal.setAttribute("aria-hidden", "false");
    }

    function closeDetail() {
      el.modal.classList.remove("open");
      el.modal.setAttribute("aria-hidden", "true");
    }

    document.addEventListener("click", event => {
      const pageButton = event.target.closest("[data-page]");
      if (pageButton) {
        state.page = pageButton.dataset.page;
        render();
        return;
      }

      const statusButton = event.target.closest("[data-status]");
      if (statusButton) {
        state.status = statusButton.dataset.status;
        render();
        return;
      }

      const authorButton = event.target.closest("[data-author-search]");
      if (authorButton) {
        event.preventDefault();
        event.stopPropagation();
        const item = DATA[Number(authorButton.dataset.authorSearch)];
        searchAuthor(item?.author);
        return;
      }

      const cardEl = event.target.closest("[data-id]");
      if (cardEl) openDetail(Number(cardEl.dataset.id));
    });

    el.search.addEventListener("input", event => {
      state.query = event.target.value;
      renderGrid();
    });

    el.sort.addEventListener("change", event => {
      state.sort = event.target.value;
      renderGrid();
    });

    el.updateFilter.addEventListener("change", event => {
      state.updateFilter = event.target.value;
      renderGrid();
    });

    el.theme.addEventListener("click", () => {
      const dark = document.documentElement.getAttribute("data-theme") === "dark";
      document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
      el.theme.textContent = dark ? "深色" : "淺色";
    });

    el.random.addEventListener("click", () => {
      openRandom(visibleItems(), "目前條件下沒有作品可以隨機。");
    });

    el.recentRandom.addEventListener("click", () => {
      openRandom(recentItems(), "目前條件下沒有近期更新的作品。");
    });

    el.toTop.addEventListener("click", () => {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    el.close.addEventListener("click", closeDetail);
    el.modal.addEventListener("click", event => {
      if (event.target === el.modal) closeDetail();
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeDetail();
    });

    render();
  </script>
</body>
</html>
